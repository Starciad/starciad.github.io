---
layout: default
---

<section>
    {{ content }}
</section>

<nav class="post-pagination">
    <h2>Navegar entre artigos</h2>

    <div class="post-pagination-list">
        {% if page.previous != nil %}
            <a class="post-pagination-link" href="{{ page.previous.url | relative_url }}">
                <span>Anterior</span>
                <strong>{{ page.previous.title }}</strong>
            </a>
        {% endif %}

        {% if page.next != nil %}
            <a class="post-pagination-link post-pagination-link--next" href="{{ page.next.url | relative_url }}">
                <span>Próximo</span>
                <strong>{{ page.next.title }}</strong>
            </a>
        {% endif %}
    </div>
</nav>
